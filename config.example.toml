# SheetBench Runner Configuration
# Copy to config.toml and adjust as needed

[solve]
url = "http://localhost:3000"
profile = "profiles/anthropic-profile.json" # Non-secret JSON; models name apiKeyEnv variables

[runner]
concurrency = 4           # Number of parallel tasks
timeout_seconds = 3600    # 1 hour timeout per task

[evaluation]
# "combined" (default) also accepts differences within the 0.01 absolute
# tolerance, including near-zero values. "relative" preserves SpreadsheetBench
# v2 behavior.
numeric_tolerance_mode = "combined"
